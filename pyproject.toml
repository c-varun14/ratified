[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratified"
version = "0.1.0"
description = "Company-brain graph over one IETF working group's public record, stored in FalkorDB."
requires-python = ">=3.11"
dependencies = [
    "falkordb",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "httpx",
    "python-multipart",
]

[project.scripts]
ratified = "ratified.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ratified"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

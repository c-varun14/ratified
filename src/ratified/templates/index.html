<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ratified</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.55 ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 62rem; }
    header h1 { margin: 0; font-size: 1.6rem; }
    header p { margin: .2rem 0 1.4rem; opacity: .7; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input[name=question] { flex: 1; padding: .6rem .7rem; font: inherit; }
    button { padding: .6rem 1rem; font: inherit; cursor: pointer; }
    .catalogue { list-style: none; padding: 0; margin: 0 0 1.5rem; opacity: .75; font-size: .85rem; }
    .catalogue code { font-weight: 600; }
    .card { border: 1px solid currentColor; border-radius: .6rem; padding: 1rem 1.2rem; }
    .card-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
    .card-head h2 { font-size: 1.1rem; margin: 0; }
    .badge { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; padding: .12rem .45rem; border-radius: .4rem; border: 1px solid currentColor; }
    .outcome-answer .badge { background: #1b5e20; color: #fff; border-color: #1b5e20; }
    .outcome-partial .badge { background: #8d6e00; color: #fff; border-color: #8d6e00; }
    .outcome-unknown .badge { background: #37474f; color: #fff; border-color: #37474f; }
    .outcome-conflict .badge { background: #8e0000; color: #fff; border-color: #8e0000; }
    .tool { font-size: .8rem; opacity: .65; margin-left: auto; }
    .empty { font-style: italic; opacity: .8; }
    .phrasing { border-left: 3px solid currentColor; padding-left: .7rem; opacity: .85; }
    .phrasing em { opacity: .6; font-size: .8rem; }
    .claims { padding-left: 1.2rem; }
    .claims li { margin: .6rem 0; }
    .chips { display: flex; flex-wrap: wrap; gap: .35rem; margin: .3rem 0 0; }
    .chip { font-size: .76rem; text-decoration: none; border: 1px solid currentColor; border-radius: 999px; padding: .08rem .5rem; opacity: .85; }
    .chip:hover { opacity: 1; }
    .claim.lead { opacity: .82; }
    .tag { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; border: 1px dashed currentColor; border-radius: .35rem; padding: 0 .3rem; opacity: .7; }
    .path-btn { font: inherit; font-size: .76rem; padding: .05rem .5rem; cursor: pointer; border: 1px solid currentColor; border-radius: 999px; background: none; color: inherit; opacity: .8; }
    .path-btn:hover { opacity: 1; }
    .receipt:empty { display: none; }
    .receipt-body { margin: .5rem 0 0; padding: .5rem .7rem; border-left: 3px solid currentColor; }
    .path { margin: .4rem 0; }
    .path-via { font-size: .76rem; opacity: .7; }
    .steps { list-style: decimal; padding-left: 1.4rem; margin: .3rem 0; }
    .steps .step { font-size: .8rem; margin: .1rem 0; }
    .steps .step a { text-decoration: none; }
    .steps .step a:hover { text-decoration: underline; }
    .step-section a { font-weight: 600; }
    .path-graph { display: block; width: 100%; max-width: 34rem; height: auto; margin: .4rem 0; }
    .path-graph text { font-size: 12px; fill: currentColor; }
    .path-graph .kind { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
    .path-graph .on-path rect { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .path-graph .ghost { opacity: .28; }
    .path-graph .ghost rect { fill: none; stroke: currentColor; stroke-dasharray: 3 3; }
    .path-graph .edge { stroke: currentColor; stroke-width: 2; }
    .path-graph .node.on-path rect { fill: color-mix(in srgb, currentColor 12%, transparent); }
    .missing li, .notes li { font-size: .82rem; opacity: .75; }
    .conflicts { font-size: .85rem; color: #8e0000; }
  </style>
</head>
<body>
  <header>
    <h1>Ratified</h1>
    <p>TLS working group · every claim carries a mechanical permalink to the public record</p>
  </header>

  <form hx-post="/ask" hx-target="#card" hx-swap="innerHTML">
    <input name="question" placeholder="Which clauses of draft-ietf-tls-tls13 were argued against and never resolved?" value="{{ question }}" autofocus>
    <button type="submit">Ask</button>
  </form>

  <ul class="catalogue">
    {% for tool in catalogue %}<li><code>{{ tool.name }}</code>({{ tool.args | join(', ') }}) — {{ tool.description }}</li>{% endfor %}
  </ul>

  <section id="card">
    {% if card %}{% include "_card.html" %}{% endif %}
  </section>
</body>
</html>
